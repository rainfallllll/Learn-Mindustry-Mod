name: build-thermal-mod

# 当 thermal-mod 源码变化或手动触发时，自动编译实战模组 jar
on:
  push:
    paths:
      - 'tutorials/thermal-mod/src/**'
      - 'tutorials/thermal-mod/build.gradle'
      - 'tutorials/thermal-mod/settings.gradle'
      - 'tutorials/thermal-mod/gradle.properties'
      - 'tutorials/thermal-mod/mod.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4

      - name: Build thermal-mod jar
        run: cd tutorials/thermal-mod && gradle --no-daemon jar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: thermal-mod-jar
          path: tutorials/thermal-mod/build/libs/*.jar
          retention-days: 90
